name: architecture-diagram

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "scripts/generate_diagram.py"
      - ".github/workflows/diagram.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: pip install diagrams python-hcl2
      - run: python scripts/generate_diagram.py --selfcheck
      - run: python scripts/generate_diagram.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate architecture diagram [skip ci]"
          file_pattern: images/architecture-diagram.png
